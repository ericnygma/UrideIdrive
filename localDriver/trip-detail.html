<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEWARD — Trip Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":                "#b9c7e4",
            "primary-container":      "#0a192f",
            "on-surface":             "#e4e2e4",
            "on-surface-variant":     "#c5c6cd",
            "on-primary-container":   "#74829d",
            "surface-container":      "#1f1f21",
            "surface-container-high": "#2a2a2c",
            "outline-variant":        "#44474d",
            "outline":                "#8f9097",
            "background":             "#131315"
          },
          fontFamily: {
            "body-md":     ["Inter", "sans-serif"],
            "label-caps":  ["Inter", "sans-serif"],
            "headline-sm": ["Noto Serif", "serif"],
            "headline-md": ["Noto Serif", "serif"],
            "display-lg":  ["Noto Serif", "serif"]
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { visibility: hidden; }
    body { background-color: #131315; color: #e4e2e4; font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
    }
    .section-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #74829d;
      margin-bottom: 0.5rem;
    }
    .detail-value {
      font-size: 1rem;
      color: #e4e2e4;
      line-height: 1.5;
    }
    .detail-sub {
      font-size: 0.825rem;
      color: #c5c6cd;
      line-height: 1.5;
    }
    .status-pill {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
    }
    .action-btn {
      border: 1px solid #44474d;
      border-radius: 0.75rem;
      padding: 0.75rem;
      font-size: 0.78rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      color: #c5c6cd;
      flex: 1;
    }
    .action-btn:hover { border-color: #b9c7e4; color: #e4e2e4; }
    .action-btn.danger:hover { border-color: #dc5050; color: #dc5050; }
    .divider { border-color: rgba(255,255,255,0.07); }
  </style>
</head>
<body class="min-h-screen pb-10">

  <!-- Nav -->
  <header class="sticky top-0 z-30 px-5 py-4 flex items-center justify-between" style="background: rgba(19,19,21,0.85); backdrop-filter: blur(16px);">
    <a href="trips.html" class="text-on-surface-variant hover:text-on-surface text-lg leading-none">&larr; Trips</a>
    <span class="font-label-caps text-xs uppercase tracking-widest text-on-primary-container">Trip Detail</span>
    <div style="width:60px"></div>
  </header>

  <!-- Loading / error -->
  <div id="loading-state" class="max-w-lg mx-auto px-5 pt-10 text-center text-on-primary-container text-sm">Loading…</div>
  <div id="error-state" class="hidden max-w-lg mx-auto px-5 pt-10 text-center text-red-400 text-sm"></div>

  <!-- Main content (hidden until loaded) -->
  <main id="content" class="hidden max-w-lg mx-auto px-5 pt-6 space-y-4 pb-6">

    <!-- Hero: date, time, type -->
    <div class="glass-card p-6">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p id="trip-date" class="font-display-lg text-4xl text-on-surface leading-tight"></p>
          <p id="trip-time-display" class="font-headline-sm text-2xl text-on-surface mt-1"></p>
          <p id="trip-type-display" class="text-on-primary-container text-sm mt-1"></p>
        </div>
        <span id="status-badge" class="status-pill flex-shrink-0 mt-1"></span>
      </div>
    </div>

    <!-- Vehicle -->
    <div class="glass-card p-5">
      <p class="section-label">The Vehicle</p>
      <p id="vehicle-name" class="font-headline-sm text-xl text-on-surface"></p>
      <p id="vehicle-sub" class="detail-sub mt-1"></p>
    </div>

    <!-- Pickup -->
    <div class="glass-card p-5">
      <p class="section-label">Pickup Location</p>
      <p id="pickup-line1" class="detail-value"></p>
      <p id="pickup-line2" class="detail-sub"></p>
      <div id="pickup-notes-row" class="hidden mt-3 pt-3 border-t divider">
        <p class="section-label">Driver Notes</p>
        <p id="pickup-notes" class="detail-sub italic"></p>
      </div>
    </div>

    <!-- Destination (hidden for Hourly) -->
    <div id="destination-card" class="glass-card p-5">
      <p class="section-label">Destination</p>
      <p id="dest-line1" class="detail-value"></p>
      <p id="dest-line2" class="detail-sub"></p>
    </div>

    <!-- Airport info (shown for Airport trips) -->
    <div id="airport-card" class="hidden glass-card p-5">
      <p class="section-label">Flight Information</p>
      <p id="airport-name" class="detail-value"></p>
      <div id="flight-row" class="hidden mt-2">
        <p id="airline-name" class="detail-sub"></p>
        <p id="flight-info" class="detail-sub"></p>
      </div>
    </div>

    <!-- Hourly end time (shown for Hourly) -->
    <div id="hourly-card" class="hidden glass-card p-5">
      <p class="section-label">Return Time</p>
      <p id="end-time-display" class="detail-value"></p>
    </div>

    <!-- Special Instructions -->
    <div id="instructions-card" class="hidden glass-card p-5">
      <p class="section-label">Special Instructions</p>
      <p id="instructions-text" class="detail-sub italic leading-relaxed"></p>
    </div>

    <!-- Actions -->
    <div class="flex gap-3 pt-2">
      <div id="cancel-btn" class="action-btn danger">
        <p class="text-xs mb-0.5">&#x2715;</p>
        <p>Cancel Trip</p>
      </div>
    </div>

    <!-- Cancel confirmation (hidden) -->
    <div id="cancel-confirm" class="hidden glass-card p-5 text-center">
      <p class="text-on-surface text-sm mb-4">Cancel this trip? This cannot be undone.</p>
      <div class="flex gap-3 justify-center">
        <button id="cancel-yes" class="px-5 py-2 rounded-lg text-sm font-medium" style="background:rgba(220,80,80,0.2);border:1px solid rgba(220,80,80,0.4);color:#dc5050;">Yes, Cancel</button>
        <button id="cancel-no"  class="px-5 py-2 rounded-lg text-sm font-medium" style="background:rgba(255,255,255,0.05);border:1px solid #44474d;color:#c5c6cd;">Keep Trip</button>
      </div>
    </div>

  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    requireAuth().then(function(user) {
      document.documentElement.style.visibility = '';
      initPage(user);
    });

    function initPage(user) {
      var tripId = new URLSearchParams(window.location.search).get('id');
      if (!tripId) {
        window.location.replace('trips.html');
        return;
      }

      db.collection('trips').doc(tripId).get()
        .then(function(doc) {
          document.getElementById('loading-state').classList.add('hidden');

          if (!doc.exists) {
            showError('Trip not found.');
            return;
          }
          var t = doc.data();
          if (t.uid !== user.uid) {
            showError('You do not have permission to view this trip.');
            return;
          }
          renderTrip(doc.id, t, user);
        })
        .catch(function(err) {
          showError('Error loading trip: ' + err.message);
        });
    }

    function showError(msg) {
      document.getElementById('loading-state').classList.add('hidden');
      var errEl = document.getElementById('error-state');
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    function renderTrip(id, t, user) {
      var content = document.getElementById('content');
      content.classList.remove('hidden');

      var isAirport = t.tripType && t.tripType.includes('Airport');
      var isHourly  = t.tripType && t.tripType.includes('Hourly');

      // Hero
      document.getElementById('trip-date').textContent       = formatFullDate(t.date);
      document.getElementById('trip-time-display').textContent = formatTime(t.time);
      document.getElementById('trip-type-display').textContent  = t.tripType || '—';

      var badge = document.getElementById('status-badge');
      var bs    = statusBadgeStyle(t.status);
      badge.textContent = t.status || 'pending';
      badge.style.background = bs.bg;
      badge.style.color       = bs.text;

      // Vehicle
      var v = t.vehicleSnap || {};
      document.getElementById('vehicle-name').textContent =
        ((v.year ? v.year + ' ' : '') + (v.make || '') + ' ' + (v.model || '')).trim() || '—';
      document.getElementById('vehicle-sub').textContent =
        [v.color, v.plate].filter(Boolean).join('  ·  ');

      // Pickup
      document.getElementById('pickup-line1').textContent = t.pickupAddress || '—';
      document.getElementById('pickup-line2').textContent =
        [t.pickupCity, t.pickupState, t.pickupZip].filter(Boolean).join(', ');
      if (t.pickupNotes) {
        document.getElementById('pickup-notes').textContent = t.pickupNotes;
        document.getElementById('pickup-notes-row').classList.remove('hidden');
      }

      // Destination / Airport
      if (isHourly) {
        document.getElementById('destination-card').classList.add('hidden');
      } else if (isAirport) {
        // Airport card
        document.getElementById('destination-card').classList.add('hidden');
        var airCard = document.getElementById('airport-card');
        airCard.classList.remove('hidden');
        document.getElementById('airport-name').textContent = t.airport || '—';
        if (t.airline || t.flightNumber || t.terminal) {
          document.getElementById('flight-row').classList.remove('hidden');
          document.getElementById('airline-name').textContent = t.airline || '';
          document.getElementById('flight-info').textContent =
            [t.flightNumber ? 'Flight ' + t.flightNumber : '', t.terminal ? 'Terminal ' + t.terminal : '']
              .filter(Boolean).join('  ·  ');
        }
      } else {
        document.getElementById('dest-line1').textContent = t.dropoffAddress || '—';
        document.getElementById('dest-line2').textContent =
          [t.dropoffCity, t.dropoffState].filter(Boolean).join(', ');
      }

      // Hourly end time
      if (isHourly && t.endTime) {
        document.getElementById('hourly-card').classList.remove('hidden');
        document.getElementById('end-time-display').textContent = formatTime(t.endTime);
      }

      // Instructions
      if (t.instructions) {
        document.getElementById('instructions-text').textContent = t.instructions;
        document.getElementById('instructions-card').classList.remove('hidden');
      }

      // Cancel action
      setupCancel(id, t, user);
    }

    function setupCancel(id, t, user) {
      var cancelBtn     = document.getElementById('cancel-btn');
      var cancelConfirm = document.getElementById('cancel-confirm');
      var cancelYes     = document.getElementById('cancel-yes');
      var cancelNo      = document.getElementById('cancel-no');

      if (t.status === 'cancelled' || t.status === 'completed') {
        cancelBtn.style.display = 'none';
        return;
      }

      cancelBtn.addEventListener('click', function() {
        cancelConfirm.classList.remove('hidden');
        cancelBtn.style.display = 'none';
      });
      cancelNo.addEventListener('click', function() {
        cancelConfirm.classList.add('hidden');
        cancelBtn.style.display = '';
      });
      cancelYes.addEventListener('click', function() {
        db.collection('trips').doc(id).update({
          status:    'cancelled',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() {
          window.location.replace('trips.html');
        });
      });
    }

    function formatFullDate(d) {
      if (!d) return '—';
      var parts  = d.split('-');
      var dt     = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      var days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return days[dt.getDay()] + ', ' + months[dt.getMonth()] + ' ' + dt.getDate();
    }

    function formatTime(t) {
      if (!t) return '—';
      var parts = t.split(':');
      var h = parseInt(parts[0], 10);
      var m = parts[1];
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return h + ':' + m + ' ' + ampm;
    }

    function statusBadgeStyle(status) {
      switch (status) {
        case 'confirmed':  return { bg: 'rgba(100,200,140,0.15)', text: '#64c88c' };
        case 'completed':  return { bg: 'rgba(150,150,150,0.15)', text: '#999' };
        case 'cancelled':  return { bg: 'rgba(220,80,80,0.15)',   text: '#dc5050' };
        default:           return { bg: 'rgba(185,199,228,0.15)', text: '#b9c7e4' };
      }
    }
  </script>
</body>
</html>
