<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEWARD — My Trips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":                "#b9c7e4",
            "primary-container":      "#0a192f",
            "on-surface":             "#e4e2e4",
            "on-surface-variant":     "#c5c6cd",
            "on-primary-container":   "#74829d",
            "surface-container":      "#1f1f21",
            "surface-container-high": "#2a2a2c",
            "outline-variant":        "#44474d",
            "outline":                "#8f9097",
            "background":             "#131315"
          },
          fontFamily: {
            "body-md":     ["Inter", "sans-serif"],
            "label-caps":  ["Inter", "sans-serif"],
            "headline-sm": ["Noto Serif", "serif"],
            "headline-md": ["Noto Serif", "serif"],
            "display-lg":  ["Noto Serif", "serif"]
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { visibility: hidden; }
    body { background-color: #131315; color: #e4e2e4; font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
    }
    .btn-sheen {
      background: linear-gradient(135deg, #e4e2e4 0%, #c7c7bb 100%);
      color: #0a192f;
    }
    .filter-pill {
      border: 1px solid #44474d;
      border-radius: 9999px;
      padding: 0.35rem 1rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      color: #8f9097;
      background: transparent;
    }
    .filter-pill.active {
      border-color: #b9c7e4;
      background: rgba(185,199,228,0.12);
      color: #e4e2e4;
    }
    .trip-row {
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .trip-row:hover { border-color: rgba(185,199,228,0.3) !important; }
    .status-pill {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.18rem 0.55rem;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- Nav -->
  <header class="sticky top-0 z-30 px-5 py-4 flex items-center justify-between" style="background: rgba(19,19,21,0.85); backdrop-filter: blur(16px);">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-on-surface-variant hover:text-on-surface text-lg leading-none">&larr;</a>
      <span class="font-headline-sm text-lg text-on-surface">My Trips</span>
    </div>
    <button id="sign-out-btn" class="text-on-primary-container text-sm hover:text-on-surface transition-colors">Sign Out</button>
  </header>

  <main class="max-w-lg mx-auto px-5 pt-6">

    <!-- Filter pills -->
    <div class="flex gap-2 mb-6">
      <button class="filter-pill active" data-filter="upcoming">Upcoming</button>
      <button class="filter-pill" data-filter="past">Past</button>
      <button class="filter-pill" data-filter="all">All</button>
    </div>

    <!-- Trip list -->
    <div id="trip-list" class="space-y-3">
      <p class="text-on-primary-container text-sm">Loading trips…</p>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden glass-card px-5 py-8 text-center">
      <p class="text-on-surface text-base font-headline-sm mb-1">No trips yet</p>
      <p class="text-on-primary-container text-sm">Book your first ride to get started.</p>
    </div>

  </main>

  <!-- FAB: Book a Ride -->
  <div class="fixed bottom-6 left-0 right-0 flex justify-center z-20 px-5">
    <a href="book-ride.html" class="btn-sheen py-4 px-10 rounded-full font-semibold text-sm tracking-widest uppercase shadow-2xl hover:opacity-90 transition-opacity">
      Book a Ride
    </a>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    requireAuth().then(function(user) {
      document.documentElement.style.visibility = '';
      initPage(user);
    });

    var currentFilter = 'upcoming';
    var allTrips = [];

    function initPage(user) {
      document.getElementById('sign-out-btn').addEventListener('click', function() {
        auth.signOut().then(function() { window.location.replace('login.html'); });
      });

      setupFilters();
      loadTrips(user);
    }

    function setupFilters() {
      var pills = document.querySelectorAll('.filter-pill');
      pills.forEach(function(pill) {
        pill.addEventListener('click', function() {
          pills.forEach(function(p) { p.classList.remove('active'); });
          pill.classList.add('active');
          currentFilter = pill.dataset.filter;
          renderTrips();
        });
      });
    }

    function loadTrips(user) {
      db.collection('trips')
        .where('uid', '==', user.uid)
        .orderBy('date', 'desc')
        .orderBy('time', 'desc')
        .onSnapshot(function(snap) {
          allTrips = [];
          snap.forEach(function(doc) {
            allTrips.push({ id: doc.id, data: doc.data() });
          });
          renderTrips();
        }, function(err) {
          // Fallback: try without orderBy if index is building
          db.collection('trips')
            .where('uid', '==', user.uid)
            .get()
            .then(function(snap) {
              allTrips = [];
              snap.forEach(function(doc) {
                allTrips.push({ id: doc.id, data: doc.data() });
              });
              allTrips.sort(function(a, b) {
                if (b.data.date !== a.data.date) return b.data.date < a.data.date ? -1 : 1;
                return (b.data.time || '') < (a.data.time || '') ? -1 : 1;
              });
              renderTrips();
            });
          console.warn('Composite index not ready, using fallback query:', err.message);
        });
    }

    function renderTrips() {
      var today = new Date().toISOString().slice(0, 10);
      var list  = document.getElementById('trip-list');
      var empty = document.getElementById('empty-state');

      var filtered = allTrips.filter(function(t) {
        if (currentFilter === 'upcoming') return t.data.date >= today && t.data.status !== 'cancelled';
        if (currentFilter === 'past')     return t.data.date < today  || t.data.status === 'completed';
        return true; // 'all'
      });

      list.innerHTML = '';

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(function(t) {
        list.appendChild(makeTripRow(t.id, t.data));
      });
    }

    function makeTripRow(id, t) {
      var el = document.createElement('div');
      el.className = 'glass-card trip-row px-5 py-4';

      var dateStr   = formatDate(t.date);
      var timeStr   = formatTime(t.time);
      var vehicle   = t.vehicleSnap ? (t.vehicleSnap.make + ' ' + t.vehicleSnap.model) : '—';
      var dest      = t.tripType && t.tripType.includes('Airport') ? (t.airport || 'Airport') :
                      (t.dropoffAddress ? t.dropoffAddress + (t.dropoffCity ? ', ' + t.dropoffCity : '') : 'Point to Point');
      var badgeStyle = statusBadgeStyle(t.status);

      el.innerHTML =
        '<div class="flex items-start gap-4">' +
          '<div class="flex-shrink-0 text-center w-10">' +
            '<p class="font-headline-sm text-2xl text-on-surface leading-none">' + dateStr.day + '</p>' +
            '<p class="text-on-primary-container text-xs uppercase tracking-wide">' + dateStr.month + '</p>' +
          '</div>' +
          '<div class="flex-1 min-w-0">' +
            '<div class="flex items-center gap-2 mb-1">' +
              '<p class="text-on-surface text-sm font-medium">' + timeStr + '</p>' +
              '<span class="status-pill" style="background:' + badgeStyle.bg + ';color:' + badgeStyle.text + '">' + (t.status || 'pending') + '</span>' +
            '</div>' +
            '<p class="text-on-surface-variant text-xs truncate">' + dest + '</p>' +
            '<p class="text-on-primary-container text-xs mt-0.5">' + vehicle + '</p>' +
          '</div>' +
          '<span class="text-on-primary-container text-lg self-center">&rsaquo;</span>' +
        '</div>';

      el.addEventListener('click', function() {
        window.location.href = 'trip-detail.html?id=' + id;
      });
      return el;
    }

    function formatDate(d) {
      if (!d) return { day: '—', month: '—' };
      var parts  = d.split('-');
      var dt     = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return { day: dt.getDate(), month: months[dt.getMonth()] };
    }

    function formatTime(t) {
      if (!t) return '—';
      var parts = t.split(':');
      var h = parseInt(parts[0], 10);
      var m = parts[1];
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return h + ':' + m + ' ' + ampm;
    }

    function statusBadgeStyle(status) {
      switch (status) {
        case 'confirmed':  return { bg: 'rgba(100,200,140,0.15)', text: '#64c88c' };
        case 'completed':  return { bg: 'rgba(150,150,150,0.15)', text: '#999' };
        case 'cancelled':  return { bg: 'rgba(220,80,80,0.15)',   text: '#dc5050' };
        default:           return { bg: 'rgba(185,199,228,0.15)', text: '#b9c7e4' };
      }
    }
  </script>
</body>
</html>
