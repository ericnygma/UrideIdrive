<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEWARD — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":                "#b9c7e4",
            "primary-container":      "#0a192f",
            "on-surface":             "#e4e2e4",
            "on-surface-variant":     "#c5c6cd",
            "on-primary-container":   "#74829d",
            "surface-container":      "#1f1f21",
            "surface-container-high": "#2a2a2c",
            "outline-variant":        "#44474d",
            "outline":                "#8f9097",
            "background":             "#131315"
          },
          fontFamily: {
            "body-md":     ["Inter", "sans-serif"],
            "label-caps":  ["Inter", "sans-serif"],
            "headline-sm": ["Noto Serif", "serif"],
            "headline-md": ["Noto Serif", "serif"],
            "display-lg":  ["Noto Serif", "serif"]
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #131315; color: #e4e2e4; font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
    }
    .btn-sheen {
      background: linear-gradient(135deg, #e4e2e4 0%, #c7c7bb 100%);
      color: #0a192f;
    }
    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid #44474d;
      border-radius: 0.5rem;
      color: #e4e2e4;
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #b9c7e4; }
    .input-field::placeholder { color: #74829d; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <!-- Wordmark -->
    <div class="text-center mb-10">
      <h1 class="font-headline-md text-4xl text-primary tracking-widest uppercase">Steward</h1>
      <p class="text-on-primary-container text-sm mt-2 font-body-md">Your personal driver, your car.</p>
    </div>

    <!-- Card -->
    <div class="glass-card p-8">
      <!-- Error message -->
      <div id="error-msg" class="hidden mb-4 px-4 py-3 rounded-lg bg-red-900/30 border border-red-700/50 text-red-300 text-sm"></div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-on-surface-variant text-xs font-label-caps uppercase tracking-wider mb-2">Email</label>
        <input id="email" type="email" class="input-field" placeholder="you@example.com" autocomplete="email">
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-on-surface-variant text-xs font-label-caps uppercase tracking-wider mb-2">Password</label>
        <input id="password" type="password" class="input-field" placeholder="••••••••" autocomplete="current-password">
      </div>

      <!-- Sign In button -->
      <button id="sign-in-btn" class="btn-sheen w-full py-3 rounded-lg font-semibold text-sm tracking-widest uppercase transition-opacity hover:opacity-90 active:opacity-75">
        Sign In
      </button>

      <!-- Loading state (hidden) -->
      <div id="loading" class="hidden text-center mt-4">
        <span class="text-on-surface-variant text-sm">Signing in…</span>
      </div>
    </div>

    <p class="text-center text-on-primary-container text-xs mt-6">
      Contact your administrator to create an account.
    </p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // If already signed in, skip to dashboard
    auth.onAuthStateChanged(function(user) {
      if (user) window.location.replace('index.html');
    });

    var signInBtn = document.getElementById('sign-in-btn');
    var errorMsg  = document.getElementById('error-msg');
    var loading   = document.getElementById('loading');

    function setLoading(on) {
      signInBtn.disabled = on;
      signInBtn.style.opacity = on ? '0.5' : '';
      loading.classList.toggle('hidden', !on);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
    }

    signInBtn.addEventListener('click', function() {
      var email = document.getElementById('email').value.trim();
      var pass  = document.getElementById('password').value;
      errorMsg.classList.add('hidden');

      if (!email || !pass) {
        showError('Please enter your email and password.');
        return;
      }

      setLoading(true);
      auth.signInWithEmailAndPassword(email, pass)
        .then(function() {
          window.location.replace('index.html');
        })
        .catch(function(err) {
          setLoading(false);
          showError(friendlyAuthError(err.code));
        });
    });

    // Allow Enter key to submit
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') signInBtn.click();
    });
  </script>
</body>
</html>
