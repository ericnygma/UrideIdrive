<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E0D0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Steward">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>STEWARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:     #EDE8DF;
      --muted:   #9E9590;
      --faint:   #2C2820;
      --gold:    #B8923A;
      --gold-lt: #D4AE62;
      --bg:      #0E0D0B;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%, rgba(184,146,58,0.07) 0%, transparent 100%),
        radial-gradient(ellipse 60% 40% at 50% 110%, rgba(10,20,40,0.8) 0%, transparent 100%);
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ─── Layout ─────────────────────────────────────────────────────────── */

    .stage {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }

    .inner {
      width: 100%; max-width: 360px;
    }

    /* ─── Wordmark ───────────────────────────────────────────────────────── */

    .wordmark {
      font-family: 'Cormorant SC', serif;
      font-weight: 300;
      font-size: clamp(3rem, 12vw, 4.5rem);
      letter-spacing: 0.38em;
      color: var(--ink);
      text-indent: 0.38em; /* compensate letter-spacing for optical centering */
      text-align: center;
      line-height: 1;
      opacity: 0;
      animation: riseIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    /* Thin gold rule */
    .rule {
      margin: 1.6rem auto;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
      animation: expandRule 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
    }

    /* Tagline */
    .tagline {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      text-indent: 0.28em;
      opacity: 0;
      animation: riseIn 1s ease 0.75s forwards;
    }

    /* ─── Form ───────────────────────────────────────────────────────────── */

    .form {
      margin-top: 3.5rem;
      opacity: 0;
      animation: riseIn 1s ease 0.95s forwards;
    }

    /* Error banner */
    .error-banner {
      display: none;
      margin-bottom: 1.75rem;
      padding: 0.7rem 0;
      border-left: 2px solid #8B3A3A;
      padding-left: 0.85rem;
      font-size: 0.78rem;
      color: #C07070;
      letter-spacing: 0.01em;
      line-height: 1.5;
    }
    .error-banner.visible { display: block; }

    /* Field */
    .field {
      position: relative;
      margin-bottom: 2.25rem;
    }

    .field label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-lt);
      margin-bottom: 0.6rem;
      font-weight: 400;
    }

    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--faint);
      outline: none;
      color: var(--ink);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 300;
      padding: 0.3rem 0 0.55rem;
      caret-color: var(--gold);
      transition: border-color 0.3s;
      letter-spacing: 0.02em;
    }

    .field input:focus {
      border-bottom-color: var(--gold);
    }

    .field input::placeholder {
      color: #322E28;
      font-style: italic;
    }

    /* Focus line animation */
    .field::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      width: 0; height: 1px;
      background: var(--gold);
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .field:focus-within::after {
      left: 0; width: 100%;
    }

    /* ─── Submit ─────────────────────────────────────────────────────────── */

    .submit-wrap {
      margin-top: 0.5rem;
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(184,146,58,0.35);
      background: rgba(184,146,58,0.08);
      color: var(--gold-lt);
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, color 0.25s;
      position: relative; overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(184,146,58,0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .submit-btn:hover:not(:disabled) {
      background: rgba(184,146,58,0.15);
      border-color: rgba(184,146,58,0.6);
      color: #E4C97A;
    }
    .submit-btn:hover:not(:disabled)::before { opacity: 1; }

    .submit-btn:active:not(:disabled) {
      background: rgba(184,146,58,0.22);
    }

    .submit-btn:disabled {
      opacity: 0.45; cursor: default;
    }

    /* Loading spinner inside button */
    .btn-text, .btn-loading { transition: opacity 0.2s; }
    .btn-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
    .btn-loading::after {
      content: '';
      width: 14px; height: 14px;
      border: 1px solid rgba(184,146,58,0.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .is-loading .btn-text   { opacity: 0; }
    .is-loading .btn-loading { opacity: 1; }

    /* ─── Footer ─────────────────────────────────────────────────────────── */

    .footer-note {
      margin-top: 3rem;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: #3A3630;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      animation: riseIn 1s ease 1.2s forwards;
    }

    /* ─── Animations ─────────────────────────────────────────────────────── */

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes expandRule {
      from { width: 0; }
      to   { width: 100%; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Password field wrapper + toggle */
    .pw-wrap { position: relative; }
    .pw-wrap .field input { padding-right: 2rem; }
    .pw-toggle {
      position: absolute; right: 0; bottom: 0.4rem;
      background: none; border: none; cursor: pointer;
      color: #44474d; font-size: 0.8rem; line-height: 1;
      padding: 0; transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--muted); }

    .hidden { display: none !important; }

    /* Mode toggle link */
    .mode-toggle-wrap {
      margin-top: 2rem;
      text-align: center;
      opacity: 0;
      animation: riseIn 1s ease 1.1s forwards;
    }
    .mode-toggle-link {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3A3630;
      text-decoration: none;
      transition: color 0.2s;
    }
    .mode-toggle-link:hover { color: var(--muted); }
  </style>
</head>
<body>

  <div class="stage">
    <div class="inner">

      <!-- Wordmark -->
      <h1 class="wordmark">Steward</h1>
      <div class="rule"></div>
      <p class="tagline">Private chauffeur scheduling</p>

      <!-- Form -->
      <form class="form" id="login-form" novalidate>

        <div id="error-banner" class="error-banner" role="alert"></div>

        <div class="field hidden" id="field-name">
          <label for="name">Your name</label>
          <input
            id="name"
            type="text"
            placeholder="First and last"
            autocomplete="name"
            autocapitalize="words"
            spellcheck="false"
          >
        </div>

        <div class="field hidden" id="field-phone">
          <label for="phone">Phone number</label>
          <input
            id="phone"
            type="tel"
            placeholder="+1 555 000 0000"
            autocomplete="tel"
          >
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
          >
        </div>

        <div class="field">
          <label for="password">Passphrase</label>
          <div class="pw-wrap">
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
            >
            <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Show passphrase">&#9679;&#9679;</button>
          </div>
        </div>

        <div class="submit-wrap">
          <button type="submit" class="submit-btn" id="sign-in-btn">
            <span class="btn-text">Enter</span>
            <span class="btn-loading" aria-hidden="true"></span>
          </button>
        </div>

      </form>

      <p class="mode-toggle-wrap">
        <a href="#" id="mode-toggle" class="mode-toggle-link">New here? Create an account.</a>
      </p>

      <p class="footer-note">Access by invitation only</p>

    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // Route signed-in users based on onboarding state
    auth.onAuthStateChanged(function(user) {
      if (!user) return;
      db.collection('users').doc(user.uid).get().then(function(doc) {
        var data = doc.exists ? doc.data() : {};
        if (data.onboardingComplete || data.onboardingSkipped) {
          window.location.replace('index.html');
        } else {
          window.location.replace('onboarding.html');
        }
      }).catch(function() {
        window.location.replace('index.html');
      });
    });

    var form     = document.getElementById('login-form');
    var signBtn  = document.getElementById('sign-in-btn');
    var errEl    = document.getElementById('error-banner');
    var modeLink = document.getElementById('mode-toggle');

    var mode = 'signin'; // 'signin' | 'signup'

    function setLoading(on) {
      signBtn.disabled = on;
      signBtn.classList.toggle('is-loading', on);
    }

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.add('visible');
    }

    function clearError() {
      errEl.classList.remove('visible');
    }

    function friendlyAuthError(code) {
      switch (code) {
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          return 'Incorrect email or passphrase.';
        case 'auth/email-already-in-use':
          return 'An account with this email already exists.';
        case 'auth/weak-password':
          return 'Please choose a longer passphrase — at least 6 characters.';
        case 'auth/invalid-email':
          return 'Please enter a valid email address.';
        case 'auth/too-many-requests':
          return 'Too many attempts. Please wait a moment and try again.';
        case 'auth/network-request-failed':
          return 'No connection. Please check your network.';
        default:
          return 'Something went wrong. Please try again.';
      }
    }

    // Toggle between sign-in and sign-up
    modeLink.addEventListener('click', function(e) {
      e.preventDefault();
      clearError();

      mode = mode === 'signin' ? 'signup' : 'signin';

      var fieldName  = document.getElementById('field-name');
      var fieldPhone = document.getElementById('field-phone');

      if (mode === 'signup') {
        fieldName.classList.remove('hidden');
        fieldPhone.classList.remove('hidden');
        signBtn.querySelector('.btn-text').textContent = 'Create Account';
        document.getElementById('password').setAttribute('autocomplete', 'new-password');
        modeLink.textContent = 'Already have an account? Sign in.';
      } else {
        fieldName.classList.add('hidden');
        fieldPhone.classList.add('hidden');
        signBtn.querySelector('.btn-text').textContent = 'Enter';
        document.getElementById('password').setAttribute('autocomplete', 'current-password');
        modeLink.textContent = 'New here? Create an account.';
      }
    });

    // Password visibility toggle
    document.getElementById('toggle-pw').addEventListener('click', function() {
      var input   = document.getElementById('password');
      var showing = input.type === 'text';
      input.type  = showing ? 'password' : 'text';
      this.textContent = showing ? '●●' : '○○';
      this.setAttribute('aria-label', showing ? 'Show passphrase' : 'Hide passphrase');
    });

    // Form submission
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      clearError();
      mode === 'signup' ? handleSignUp() : handleSignIn();
    });

    function withTimeout(promise, ms, onTimeout) {
      var t = setTimeout(onTimeout, ms);
      return promise.then(
        function(v) { clearTimeout(t); return v; },
        function(e) { clearTimeout(t); return Promise.reject(e); }
      );
    }

    function handleSignIn() {
      var email = document.getElementById('email').value.trim();
      var pass  = document.getElementById('password').value;

      if (!email || !pass) {
        showError('Please enter your email and passphrase.');
        return;
      }

      setLoading(true);
      withTimeout(
        auth.signInWithEmailAndPassword(email, pass),
        15000,
        function() { setLoading(false); showError('Connection is taking too long. Check your network and try again.'); }
      )
        .then(function() {
          window.location.replace('index.html');
        })
        .catch(function(err) {
          setLoading(false);
          showError(friendlyAuthError(err.code));
        });
    }

    function handleSignUp() {
      var name  = document.getElementById('name').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var email = document.getElementById('email').value.trim();
      var pass  = document.getElementById('password').value;

      if (!name || !email || !pass) {
        showError('Please enter your name, email, and passphrase.');
        return;
      }

      setLoading(true);
      withTimeout(
        auth.createUserWithEmailAndPassword(email, pass),
        15000,
        function() { setLoading(false); showError('Connection is taking too long. Check your network and try again.'); }
      )
        .then(function(cred) {
          var profile = {
            name: name,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
          if (phone) profile.phone = phone;
          return db.collection('users').doc(cred.user.uid).set(profile);
        })
        .then(function() {
          window.location.replace('onboarding.html');
        })
        .catch(function(err) {
          setLoading(false);
          showError(friendlyAuthError(err.code));
        });
    }
  </script>
</body>
</html>
