<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Steward">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>STEWARD — New Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .hidden { display: none !important; }

    :root {
      --ink:      #E7EBF0;
      --muted:    #8A93A0;
      --line:     #2A313B;
      --amber:    #F2A23C;
      --amber-lt: #FFC97A;
      --bg:       #0F1216;
      --panel:    #171B21;
      --border:   rgba(242,162,60,0.14);
      --green:    #74C28A;
    }

    html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 90% 50% at 50% -5%, rgba(91,191,180,0.06) 0%, transparent 100%),
        radial-gradient(ellipse 40% 30% at 90% 110%, rgba(0,5,10,0.4) 0%, transparent 100%);
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .stage { position: relative; z-index: 1; padding-bottom: 5rem; }

    /* ── Auth overlay ─── */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    #auth-overlay p { color: var(--muted); font-size: 0.82rem; letter-spacing: 0.08em; }

    /* ── Header ──────── */
    .site-header {
      position: sticky; top: 0; z-index: 30;
      padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.5rem 1rem;
      display: flex; align-items: center; gap: 1rem;
      background: rgba(15,18,22,0.9);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(242,162,60,0.08);
    }
    .back-link {
      color: var(--muted); text-decoration: none;
      font-size: 1.1rem; line-height: 1; transition: color 0.2s;
    }
    .back-link:hover { color: var(--ink); }
    .page-title {
      font-family: 'Cormorant SC', serif;
      font-weight: 300; font-size: 1rem;
      letter-spacing: 0.2em; color: var(--ink);
    }

    /* ── Layout ──────── */
    main { max-width: 480px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── Error banner ── */
    #form-error {
      display: none;
      margin-bottom: 2rem;
      padding: 0.65rem 0 0.65rem 0.85rem;
      border-left: 2px solid rgba(226,109,92,0.5);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: #E26D5C;
      line-height: 1.5;
    }
    #form-error.visible { display: block; }

    /* ── Section ─────── */
    .form-section { margin-bottom: 2.5rem; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .section-title {
      font-family: 'Cormorant SC', serif;
      font-weight: 300; font-size: 1.1rem;
      letter-spacing: 0.12em; color: var(--ink);
    }
    .section-rule {
      border: none; height: 1px;
      background: linear-gradient(90deg, var(--line), transparent);
      margin-bottom: 1.25rem;
    }

    /* ── Field ───────── */
    .field { margin-bottom: 1.5rem; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber-lt);
      margin-bottom: 0.5rem;
      font-weight: 400;
    }
    .field-label-muted { color: var(--muted); }
    .field-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      outline: none;
      color: var(--ink);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 300;
      padding: 0.25rem 0 0.5rem;
      caret-color: var(--amber);
      transition: border-color 0.3s;
      letter-spacing: 0.02em;
    }
    .field-input:focus { border-bottom-color: rgba(242,162,60,0.7); }
    .field-input::placeholder { color: var(--line); font-style: italic; }
    .field-input::-webkit-calendar-picker-indicator { filter: invert(0.4); }

    select.field-input { cursor: pointer; }
    select.field-input option { background: #1E232B; }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .field-row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.25rem; }

    /* ── Vehicle cards ── */
    .vehicle-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .vehicle-card { cursor: pointer; }
    .vehicle-card input[type="radio"] { display: none; }
    .vehicle-card-inner {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      transition: border-color 0.2s;
    }
    .vehicle-card input[type="radio"]:checked + .vehicle-card-inner {
      border-bottom-color: rgba(242,162,60,0.6);
    }
    .vehicle-card input[type="radio"]:checked + .vehicle-card-inner .vehicle-name {
      color: var(--ink);
    }
    .vehicle-card input[type="radio"]:checked + .vehicle-card-inner .vehicle-check {
      opacity: 1;
    }
    .vehicle-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; color: #8A93A0;
      transition: color 0.2s;
    }
    .vehicle-sub {
      font-size: 0.65rem; letter-spacing: 0.06em;
      color: var(--muted); margin-top: 0.15rem;
    }
    .vehicle-check {
      color: var(--amber); font-size: 0.85rem;
      opacity: 0; transition: opacity 0.2s;
    }

    #no-vehicles {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 1rem; color: var(--muted);
    }
    #no-vehicles a { color: var(--amber); text-decoration: none; }
    #no-vehicles a:hover { text-decoration: underline; }

    /* ── Trip type pills ── */
    .type-pills {
      display: flex; gap: 0.5rem;
      overflow-x: auto; padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .type-pills::-webkit-scrollbar { display: none; }
    .type-pill {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase;
      padding: 0.4rem 1rem;
      border: 1px solid var(--line); border-radius: 9999px;
      background: transparent; color: var(--muted);
      cursor: pointer; white-space: nowrap;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .type-pill.active {
      border-color: rgba(242,162,60,0.55);
      background: rgba(242,162,60,0.08);
      color: var(--amber-lt);
    }

    /* ── Submit ────────── */
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--amber-lt) 0%, var(--amber) 100%);
      color: var(--bg);
      border: none; border-radius: 0.4rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
      position: relative; overflow: hidden;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.45; cursor: default; }

    .btn-text, .btn-loading { transition: opacity 0.2s; }
    .btn-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
    }
    .btn-loading::after {
      content: '';
      width: 14px; height: 14px;
      border: 1px solid rgba(15,18,22,0.3);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .is-loading .btn-text   { opacity: 0; }
    .is-loading .btn-loading { opacity: 1; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Utilities ── */
    .label-opt  { text-transform: none; }
    .section-optional {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 0.85rem; color: var(--muted);
    }
    textarea.field-input { resize: none; line-height: 1.55; }
    #end-time-row { max-width: 180px; }

    /* ── Address autocomplete ── */
    .ac-field { position: relative; }
    .ac-dropdown {
      position: absolute;
      top: calc(100% + 3px);
      left: 0; right: 0;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 6px;
      z-index: 300;
      box-shadow: 0 10px 32px rgba(0,0,0,0.55);
      overflow: hidden;
    }
    .ac-dropdown.hidden { display: none; }
    .ac-group + .ac-group { border-top: 1px solid var(--line); }
    .ac-group-label {
      font-size: 0.59rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 0.5rem 0.85rem 0.2rem;
    }
    .ac-item {
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ac-item:hover, .ac-item.ac-active { background: rgba(255,255,255,0.05); }
    .ac-item-main { color: var(--ink); font-size: 0.88rem; display: block; }
    .ac-item-sub  { color: var(--muted); font-size: 0.72rem; display: block; margin-top: 0.1rem; }
    .ac-msg { padding: 0.5rem 0.85rem; color: var(--dim); font-size: 0.78rem; font-style: italic; }

    /* ── Success panel ── */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #success-panel {
      max-width: 480px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .success-check {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(116,194,138,0.35);
      background: rgba(116,194,138,0.07);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: riseIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
    }
    .success-check svg { width: 22px; height: 22px; stroke: #74C28A; fill: none; stroke-width: 1.5; }

    .success-heading {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.4rem, 10vw, 3.2rem);
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.05;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: riseIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;
    }

    .success-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: riseIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.25s forwards;
    }

    .success-summary {
      border-top: 1px solid var(--line);
      padding-top: 1.75rem;
      margin-bottom: 2.5rem;
      display: flex; flex-direction: column; gap: 1.1rem;
      opacity: 0;
      animation: riseIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.35s forwards;
    }

    .summary-row {
      display: flex; align-items: flex-start; gap: 1rem;
    }
    .summary-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 4.5rem;
      padding-top: 0.2rem;
      flex-shrink: 0;
    }
    .summary-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--ink);
      line-height: 1.4;
    }

    .success-actions {
      display: flex; flex-direction: column; gap: 0.75rem;
      opacity: 0;
      animation: riseIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.45s forwards;
    }

    .action-primary {
      display: block;
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--amber-lt) 0%, var(--amber) 100%);
      color: var(--bg);
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      text-align: center; text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .action-primary:hover { opacity: 0.88; }

    .action-secondary {
      display: block;
      width: 100%;
      padding: 0.85rem;
      border: 1px solid var(--line);
      background: none;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase;
      text-align: center; text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .action-secondary:hover { border-color: rgba(242,162,60,0.3); color: var(--ink); }

    .action-calendar {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      width: 100%;
      padding: 0.85rem;
      border: 1px solid rgba(242,162,60,0.2);
      background: rgba(242,162,60,0.04);
      color: var(--amber-lt);
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase;
      text-align: center; text-decoration: none;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s, color 0.25s;
    }
    .action-calendar:hover {
      border-color: rgba(242,162,60,0.45);
      background: rgba(242,162,60,0.09);
      color: #FFD99A;
    }
    .action-calendar svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none; stroke-width: 1.5;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="auth-overlay"><p>Loading…</p></div>

  <div class="stage">
    <header class="site-header">
      <a href="index.html" class="back-link" id="header-back">&larr;</a>
      <span class="page-title" id="header-title">New Booking</span>
    </header>

    <!-- ── Success panel (hidden until booking saved) ── -->
    <div id="success-panel" class="hidden">
      <div class="success-check">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 class="success-heading">Scheduled.</h1>
      <p class="success-sub">Your ride has been added to your itinerary.</p>
      <div class="success-summary">
        <div class="summary-row">
          <span class="summary-label">When</span>
          <span class="summary-value" id="sc-when"></span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Pickup</span>
          <span class="summary-value" id="sc-pickup"></span>
        </div>
        <div class="summary-row" id="sc-dest-row">
          <span class="summary-label">To</span>
          <span class="summary-value" id="sc-dest"></span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Vehicle</span>
          <span class="summary-value" id="sc-vehicle"></span>
        </div>
      </div>
      <div class="success-actions">
        <a id="sc-view-btn" href="#" class="action-primary">View Trip Details</a>
        <button type="button" id="sc-cal-btn" class="action-calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Add to Calendar
        </button>
        <a href="index.html" class="action-secondary">Return to Dashboard</a>
      </div>
    </div>

    <main id="booking-form">

      <div id="form-error"></div>

      <!-- Vehicle -->
      <div class="form-section">
        <div class="section-head">
          <h3 class="section-title">Vehicle</h3>
        </div>
        <hr class="section-rule">
        <div id="vehicle-list" class="vehicle-list"></div>
        <p id="no-vehicles" class="hidden">
          No vehicles on file. <a href="index.html">Add one from your dashboard</a>.
        </p>
      </div>

      <!-- Trip Type -->
      <div class="form-section">
        <div class="section-head">
          <h3 class="section-title">Trip Type</h3>
        </div>
        <hr class="section-rule">
        <div class="type-pills">
          <button type="button" class="type-pill active" data-type="Point to Point">Point to Point</button>
          <button type="button" class="type-pill" data-type="Airport Drop-off">Airport Drop-off</button>
          <button type="button" class="type-pill" data-type="Airport Pick-up">Airport Pick-up</button>
          <button type="button" class="type-pill" data-type="Hourly - Wait &amp; Return">Hourly</button>
        </div>
      </div>

      <!-- Date & Time -->
      <div class="form-section">
        <div class="section-head">
          <h3 class="section-title">Date &amp; Time</h3>
        </div>
        <hr class="section-rule">
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="trip-date">Date</label>
            <input id="trip-date" type="date" class="field-input">
          </div>
          <div class="field">
            <label class="field-label" for="trip-time">Departure</label>
            <select id="trip-time" class="field-input"><option value="">— select time —</option></select>
          </div>
        </div>
        <div id="end-time-row" class="field hidden">
          <label class="field-label" for="trip-end-time">End Time</label>
          <select id="trip-end-time" class="field-input"><option value="">— select time —</option></select>
        </div>
      </div>

      <!-- Pickup -->
      <div class="form-section">
        <div class="section-head">
          <h3 class="section-title">Pickup</h3>
        </div>
        <hr class="section-rule">
        <div class="field">
          <label class="field-label" for="pickup-address">Street Address</label>
          <input id="pickup-address" type="text" class="field-input" placeholder="123 Main St">
        </div>
        <div class="field-row-3">
          <div class="field">
            <label class="field-label" for="pickup-city">City</label>
            <input id="pickup-city" type="text" class="field-input" placeholder="Greenwich">
          </div>
          <div class="field">
            <label class="field-label" for="pickup-state">State</label>
            <input id="pickup-state" type="text" class="field-input" placeholder="CT" maxlength="2">
          </div>
          <div class="field">
            <label class="field-label" for="pickup-zip">ZIP</label>
            <input id="pickup-zip" type="text" class="field-input" placeholder="06830" maxlength="5">
          </div>
        </div>
        <div class="field">
          <label class="field-label field-label-muted" for="pickup-notes">Pickup Notes <span class="label-opt">(optional)</span></label>
          <textarea id="pickup-notes" class="field-input" rows="2" placeholder="Gate code, building entry, where to wait…"></textarea>
        </div>
      </div>

      <!-- Destination (P2P) -->
      <div id="destination-section" class="form-section">
        <div class="section-head">
          <h3 class="section-title">Destination</h3>
        </div>
        <hr class="section-rule">
        <div class="field">
          <label class="field-label" for="dropoff-address">Street Address</label>
          <input id="dropoff-address" type="text" class="field-input" placeholder="456 Park Ave">
        </div>
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="dropoff-city">City</label>
            <input id="dropoff-city" type="text" class="field-input" placeholder="New York">
          </div>
          <div class="field">
            <label class="field-label" for="dropoff-state">State</label>
            <input id="dropoff-state" type="text" class="field-input" placeholder="NY" maxlength="2">
          </div>
        </div>
      </div>

      <!-- Airport -->
      <div id="airport-section" class="form-section hidden">
        <div class="section-head">
          <h3 class="section-title">Flight Information</h3>
        </div>
        <hr class="section-rule">
        <div class="field">
          <label class="field-label" for="airport">Airport</label>
          <select id="airport" class="field-input">
            <option value="">Select airport…</option>
            <optgroup label="New York City">
              <option value="JFK – John F. Kennedy International">JFK – John F. Kennedy International</option>
              <option value="LGA – LaGuardia">LGA – LaGuardia</option>
              <option value="EWR – Newark Liberty International">EWR – Newark Liberty International</option>
            </optgroup>
            <optgroup label="New York State">
              <option value="HPN – Westchester County (White Plains)">HPN – Westchester County (White Plains)</option>
              <option value="ISP – Long Island MacArthur (Islip)">ISP – Long Island MacArthur (Islip)</option>
              <option value="SWF – New York Stewart International">SWF – New York Stewart International</option>
              <option value="ALB – Albany International">ALB – Albany International</option>

  <script>
    requireAuth().then(function(user) {
      document.getElementById('auth-overlay').style.display = 'none';
      initPage(user);
    });

    var currentUser;
    var selectedVehicleId   = null;
    var selectedVehicleSnap = null;
    var currentTripType     = 'Point to Point';
    var vehiclesReady;
    var resolveVehiclesReady;
    vehiclesReady = new Promise(function(res) { resolveVehiclesReady = res; });
    var currentAirportCode = '';
    var applyAirportFilter; // assigned by setupAirportAirlineFilter
    var addressHistory = [];

    function initPage(user) {
      currentUser = user;
      populateTimeSelects();
      setDefaultDate();
      loadVehicles(user);
      loadAddressHistory(user);
      setupAirportAirlineFilter();
      setupAddressAutocomplete('pickup-address',  'pickup-city',  'pickup-state',  'pickup-zip');
      setupAddressAutocomplete('dropoff-address', 'dropoff-city', 'dropoff-state', null);
      setupTripTypeToggle();
      setupSubmit(user);

      var params = new URLSearchParams(window.location.search);
      var copyId = params.get('copy');
      if (copyId) {
        db.collection('trips').doc(copyId).get().then(function(doc) {
          if (doc.exists && doc.data().uid === user.uid) {
            vehiclesReady.then(function() { preFillFromTrip(doc.data()); });
          }
        });
      } else if (params.get('route')) {
        vehiclesReady.then(function() { preFillFromRoute(params); });
      }
    }

    function preFillFromRoute(params) {
      var type = params.get('type');
      if (type) {
        document.querySelectorAll('.type-pill').forEach(function(pill) {
          if (pill.dataset.type === type) pill.click();
        });
      }
      var set = function(id, val) { var el = document.getElementById(id); if (el && val) el.value = val; };
      set('pickup-address',  params.get('pickup'));
      set('pickup-city',     params.get('city'));
      set('dropoff-address', params.get('dropoff'));
      set('dropoff-city',    params.get('dropoffCity'));
      set('airport',         params.get('airport'));
      var airportEl = document.getElementById('airport');
      if (airportEl && airportEl.value && applyAirportFilter) {
        applyAirportFilter(airportEl.value.substring(0, 3));
      }
    }

    function preFillFromTrip(t) {
      document.querySelector('.page-title').textContent = 'Duplicate Booking';

      // Trip type — click the matching pill to trigger section visibility
      var pills = document.querySelectorAll('.type-pill');
      pills.forEach(function(pill) {
        if (pill.dataset.type === t.tripType) pill.click();
      });

      // Pickup
      var set = function(id, val) { var el = document.getElementById(id); if (el) el.value = val || ''; };
      set('pickup-address', t.pickupAddress);
      set('pickup-city',    t.pickupCity);
      set('pickup-state',   t.pickupState);
      set('pickup-zip',     t.pickupZip);
      set('pickup-notes',   t.pickupNotes);

      // Destination (P2P)
      set('dropoff-address', t.dropoffAddress);
      set('dropoff-city',    t.dropoffCity);
      set('dropoff-state',   t.dropoffState);

      // Airport — filter airlines first, then restore saved values
      set('airport', t.airport);
      if (t.airport && applyAirportFilter) { applyAirportFilter(t.airport.substring(0, 3)); }
      set('airline',        t.airline);
      set('flight-number',  t.flightNumber);
      set('terminal',       t.terminal);

      // Instructions
      set('instructions', t.instructions);

      // Vehicle — select matching radio if it still exists
      if (t.vehicleId) {
        var radio = document.querySelector('input[name="vehicle"][value="' + t.vehicleId + '"]');
        if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change')); }
      }

      // Clear time so the user picks fresh; keep date as today
      set('trip-time', '');
    }

    function populateTimeSelects() {
      var ids = ['trip-time', 'trip-end-time'];
      var html = '<option value="">— select time —</option>';
      for (var h = 0; h < 24; h++) {
        for (var m = 0; m < 60; m += 15) {
          var hh = String(h).padStart(2, '0');
          var mm = String(m).padStart(2, '0');
          var displayH = h % 12 || 12;
          var ampm = h < 12 ? 'AM' : 'PM';
          html += '<option value="' + hh + ':' + mm + '">' + displayH + ':' + mm + ' ' + ampm + '</option>';
        }
      }
      ids.forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.innerHTML = html;
      });
    }

    function setDefaultDate() {
      var now   = new Date();
      var today = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0');
      var dateInput = document.getElementById('trip-date');
      dateInput.min   = today;
      dateInput.value = today;
    }

    function loadVehicles(user) {
      var list  = document.getElementById('vehicle-list');
      var noVeh = document.getElementById('no-vehicles');

      db.collection('users').doc(user.uid).collection('vehicles').get()
        .then(function(snap) {
          list.innerHTML = '';
          if (snap.empty) {
            list.classList.add('hidden');
            noVeh.classList.remove('hidden');
            return;
          }
          snap.forEach(function(doc) {
            var v = doc.data();

            var label = document.createElement('label');
            label.className = 'vehicle-card';
            label.innerHTML =
              '<input type="radio" name="vehicle" value="' + doc.id + '">' +
              '<div class="vehicle-card-inner">' +
                '<div>' +
                  '<p class="vehicle-name">' +
                    (v.year ? v.year + ' ' : '') + (v.make || '') + ' ' + (v.model || '') +
                  '</p>' +
                  '<p class="vehicle-sub">' +
                    (v.color || '') + (v.plate ? ' &nbsp;·&nbsp; ' + v.plate : '') +
                  '</p>' +
                '</div>' +
                '<span class="vehicle-check">&#10003;</span>' +
              '</div>';

            label.querySelector('input').addEventListener('change', function() {
              selectedVehicleId   = doc.id;
              selectedVehicleSnap = { year: v.year, make: v.make, model: v.model, color: v.color, plate: v.plate };
            });
            list.appendChild(label);
          });

          var firstRadio = list.querySelector('input[type="radio"]');
          if (firstRadio) {
            firstRadio.checked = true;
            firstRadio.dispatchEvent(new Event('change'));
          }
          resolveVehiclesReady();
        });
    }

          'Singapore Airlines': 'Int\'l',  'Japan Airlines': 'Int\'l',
          'Korean Air': 'Int\'l',          'ANA All Nippon Airways': 'Int\'l',
          'Cathay Pacific': 'Int\'l',      'Air China': 'Int\'l'
        },
        SEA: {
          'Alaska Airlines': 'N',          'Delta Air Lines': 'S',
          'American Airlines': 'S',        'United Airlines': 'C',
          'Southwest Airlines': 'C'
        },
        PHL: {
          'American Airlines': 'A, B, C, D, E, F',
          'Southwest Airlines': 'E',       'United Airlines': 'B',
          'Delta Air Lines': 'C'
        },
        DCA: {
          'American Airlines': 'B, C',     'Delta Air Lines': 'A',
          'United Airlines': 'A',          'Southwest Airlines': 'C',
          'Alaska Airlines': 'A'
        },
        IAD: {
          'United Airlines': 'C, D',       'American Airlines': 'A',
          'Air Canada': 'A'
        },
        DTW: {
          'Delta Air Lines': 'McNamara',   'American Airlines': 'McNamara',
          'Southwest Airlines': 'North',   'Spirit Airlines': 'North',
          'Air Canada': 'McNamara'
        },
        MSP: {
          'Delta Air Lines': '1',          'Sun Country Airlines': '2',
          'American Airlines': '1',        'United Airlines': '1',
          'Southwest Airlines': '2',       'Spirit Airlines': '1'
        }
      };
    })();

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function loadAddressHistory(user) {
      var seen = {};
      var results = [];
      function add(addr, city, state, zip) {
        if (!addr || !addr.trim()) return;
        var key = addr.trim().toLowerCase() + '|' + (city || '').trim().toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        results.push({
          address: addr.trim(),
          city:  (city  || '').trim(),
          state: (state || '').trim(),
          zip:   (zip   || '').trim()
        });
      }
      Promise.all([
        db.collection('users').doc(user.uid).collection('savedRoutes').get(),
        db.collection('trips').where('uid', '==', user.uid).limit(40).get()
      ]).then(function(snaps) {
        snaps[0].forEach(function(doc) {
          var r = doc.data();
          add(r.pickupAddress,  r.pickupCity);
          add(r.dropoffAddress, r.dropoffCity);
        });
        snaps[1].forEach(function(doc) {
          var t = doc.data();
          add(t.pickupAddress,  t.pickupCity,  t.pickupState, t.pickupZip);
          add(t.dropoffAddress, t.dropoffCity, t.dropoffState);
        });
        addressHistory = results;
      }).catch(function() {});
    }

    function setupAddressAutocomplete(addrId, cityId, stateId, zipId) {
      var addrEl  = document.getElementById(addrId);
      var cityEl  = cityId  ? document.getElementById(cityId)  : null;
      var stateEl = stateId ? document.getElementById(stateId) : null;
      var zipEl   = zipId   ? document.getElementById(zipId)   : null;
      if (!addrEl) return;

      var fieldEl = addrEl.closest('.field');
      if (fieldEl) fieldEl.classList.add('ac-field');

      var dropdown = document.createElement('div');
      dropdown.className = 'ac-dropdown hidden';
      (fieldEl || addrEl.parentNode).appendChild(dropdown);

      var activeIdx = -1;
      var allItems  = [];
      var nomTimer  = null;
      var lastQ     = '';

      function histMatches(q) {
        if (!q) return addressHistory.slice(0, 6);
        var ql = q.toLowerCase();
        return addressHistory.filter(function(h) {
          return h.address.toLowerCase().indexOf(ql) !== -1 ||
                 (h.city && h.city.toLowerCase().indexOf(ql) !== -1);
        }).slice(0, 5);
      }

      function render(hItems, nItems, loading) {
        activeIdx = -1;
        allItems  = [];
        var html  = '';
        if (hItems.length) {
          html += '<div class="ac-group"><div class="ac-group-label">Saved &amp; Recent</div>';
          hItems.forEach(function(h) {
            var idx = allItems.push(h) - 1;
            var sub = [h.city, h.state].filter(Boolean).join(', ');
            html += '<div class="ac-item" data-idx="' + idx + '">' +
              '<span class="ac-item-main">' + esc(h.address) + '</span>' +
              (sub ? '<span class="ac-item-sub">' + esc(sub) + '</span>' : '') +
              '</div>';
          });
          html += '</div>';
        }
        if (loading) html += '<div class="ac-msg">Searching…</div>';
        if (nItems && nItems.length) {
          html += '<div class="ac-group"><div class="ac-group-label">Suggestions</div>';
          nItems.forEach(function(n) {
            var idx = allItems.push(n) - 1;
            var sub = [n.city, n.state].filter(Boolean).join(', ');
            html += '<div class="ac-item" data-idx="' + idx + '">' +
              '<span class="ac-item-main">' + esc(n.address) + '</span>' +
              (sub ? '<span class="ac-item-sub">' + esc(sub) + '</span>' : '') +
              '</div>';
          });
          html += '</div>';
        }
        if (!html) { close(); return; }
        dropdown.innerHTML = html;
        dropdown.classList.remove('hidden');
        dropdown.querySelectorAll('.ac-item').forEach(function(el) {
          el.addEventListener('mousedown', function(e) {
            e.preventDefault();
            pick(allItems[parseInt(this.dataset.idx, 10)]);
          });
        });
      }

      function pick(item) {
        addrEl.value = item.address;
        if (cityEl  && item.city)  cityEl.value  = item.city;
        if (stateEl && item.state) stateEl.value = item.state;
        if (zipEl   && item.zip)   zipEl.value   = item.zip;
        close();
      }

      function close() {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';
        activeIdx = -1;
        allItems  = [];
      }

      function fetchNominatim(q) {
        var h = histMatches(q);
        render(h, null, true);
        fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=' +
          encodeURIComponent(q), { headers: { 'Accept-Language': 'en' } })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (addrEl.value.trim() !== q) return; // discard stale response
            var nItems = data.map(function(d) {
              var a   = d.address || {};
              var num = a.house_number || '';
              var rd  = a.road || a.pedestrian || a.path || '';
              var st  = num ? num + ' ' + rd : (rd || d.display_name.split(',')[0]);
              return {
                address: st.trim(),
                city:  a.city || a.town || a.village || '',
                state: a.state || '',
                zip:   (a.postcode || '').split('-')[0]
              };
            }).filter(function(n) { return n.address; });
            render(histMatches(q), nItems, false);
          })
          .catch(function() { render(histMatches(q), null, false); });
      }

      addrEl.setAttribute('autocomplete', 'off');

      addrEl.addEventListener('focus', function() {
        var h = histMatches(this.value.trim());
        if (h.length) render(h, null, false);
      });

      addrEl.addEventListener('input', function() {
        var q = this.value.trim();
        clearTimeout(nomTimer);
        var h = histMatches(q);
        if (!q || q.length < 3) { if (h.length) render(h, null, false); else close(); return; }
        if (q === lastQ) return;
        lastQ = q;
        render(h, null, h.length < 2);
        nomTimer = setTimeout(function() { fetchNominatim(q); }, 420);
      });

      addrEl.addEventListener('blur',    function() { setTimeout(close, 160); });

      addrEl.addEventListener('keydown', function(e) {
        var els = dropdown.querySelectorAll('.ac-item');
        if (!els.length) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIdx = Math.min(activeIdx + 1, els.length - 1);
          els.forEach(function(el, i) { el.classList.toggle('ac-active', i === activeIdx); });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIdx = Math.max(activeIdx - 1, 0);
          els.forEach(function(el, i) { el.classList.toggle('ac-active', i === activeIdx); });
        } else if (e.key === 'Enter' && activeIdx >= 0) {
          e.preventDefault();
          pick(allItems[activeIdx]);
        } else if (e.key === 'Escape') {
          close();
        }
      });
    }

    function setupAirportAirlineFilter() {
      var airportSel = document.getElementById('airport');
      var airlineSel = document.getElementById('airline');
      var terminalIn = document.getElementById('terminal');
      if (!airportSel || !airlineSel || !terminalIn) return;

      var GROUPS = [
        { label: 'US Carriers', airlines: ['Alaska Airlines','Allegiant Air','American Airlines',
            'Avelo Airlines','Breeze Airways','Delta Air Lines','Frontier Airlines',
            'Hawaiian Airlines','JetBlue Airways','Southwest Airlines','Spirit Airlines',
            'Sun Country Airlines','United Airlines'] },
        { label: 'Canada', airlines: ['Air Canada','Air Transat','WestJet'] },
        { label: 'Europe', airlines: ['Aer Lingus','Air France','Austrian Airlines',
            'British Airways','Condor','Eurowings','Finnair','Iberia','Icelandair',
            'KLM Royal Dutch Airlines','LOT Polish Airlines','Lufthansa','Norwegian Air',
            'SAS Scandinavian Airlines','Swiss International Air Lines','TAP Air Portugal',
            'Turkish Airlines','Virgin Atlantic'] },
        { label: 'Middle East', airlines: ['El Al Israel Airlines','Emirates',
            'Etihad Airways','Qatar Airways'] },
        { label: 'Asia & Pacific', airlines: ['ANA All Nippon Airways','Air China',
            'Cathay Pacific','EVA Air','Japan Airlines','Korean Air','Singapore Airlines'] },
        { label: 'Latin America & Caribbean', airlines: ['Aeromexico','Avianca',
            'Caribbean Airlines','Copa Airlines','LATAM Airlines'] }
      ];

      applyAirportFilter = function(code) {
        currentAirportCode = code || '';
        var allowed = code && window._AIRPORT_AIRLINES[code] ? window._AIRPORT_AIRLINES[code] : null;
        var prev = airlineSel.value;

        var html = '<option value="">Select airline…</option>';
        GROUPS.forEach(function(g) {
          var opts = '';
          g.airlines.forEach(function(a) {
            if (!allowed || allowed.indexOf(a) !== -1) {
              opts += '<option>' + a + '</option>';
            }
          });
          if (opts) html += '<optgroup label="' + g.label + '">' + opts + '</optgroup>';
        });
        airlineSel.innerHTML = html;

        if (prev) { airlineSel.value = prev; }

        var hint = (code && window._AIRPORT_TERMINAL_HINTS[code])
          ? window._AIRPORT_TERMINAL_HINTS[code] : '4';
        terminalIn.placeholder = hint;
      };

      airportSel.addEventListener('change', function() {
        var code = this.value ? this.value.substring(0, 3) : '';
        applyAirportFilter(code);
        airlineSel.value = '';
        terminalIn.value = '';
      });

      airlineSel.addEventListener('change', function() {
        var airline = this.value;
        var map = window._AIRLINE_TERMINAL;
        if (currentAirportCode && airline && map[currentAirportCode] && map[currentAirportCode][airline]) {
          terminalIn.value = map[currentAirportCode][airline];
        }
      });
    }

    function setupTripTypeToggle() {
      var pills       = document.querySelectorAll('.type-pill');
      var destSection = document.getElementById('destination-section');
      var airSection  = document.getElementById('airport-section');
      var endTimeRow  = document.getElementById('end-time-row');

      pills.forEach(function(pill) {
        pill.addEventListener('click', function() {
          pills.forEach(function(p) { p.classList.remove('active'); });
          pill.classList.add('active');
          currentTripType = pill.dataset.type;
          var isAirport = currentTripType.includes('Airport');
          var isHourly  = currentTripType.includes('Hourly');
          destSection.classList.toggle('hidden', isHourly || isAirport);
          airSection.classList.toggle('hidden', !isAirport);
          endTimeRow.classList.toggle('hidden', !isHourly);
        });
      });
    }

    function setupSubmit(user) {
      var submitBtn = document.getElementById('submit-btn');
      var errorEl   = document.getElementById('form-error');

      submitBtn.addEventListener('click', function() {
        errorEl.classList.remove('visible');

        var errors = validate();
        if (errors.length) {
          errorEl.textContent = errors[0];
          errorEl.classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        submitBtn.disabled = true;
        submitBtn.classList.add('is-loading');

        var isAirport = currentTripType.includes('Airport');
        var isHourly  = currentTripType.includes('Hourly');

        db.collection('trips').add({
          uid:            user.uid,
          vehicleId:      selectedVehicleId,
          vehicleSnap:    selectedVehicleSnap,
          tripType:       currentTripType,
          pickupAddress:  val('pickup-address'),
          pickupCity:     val('pickup-city'),
          pickupState:    val('pickup-state').toUpperCase(),
          pickupZip:      val('pickup-zip'),
          pickupNotes:    val('pickup-notes'),
          dropoffAddress: isHourly  ? '' : val('dropoff-address'),
          dropoffCity:    isHourly  ? '' : val('dropoff-city'),
          dropoffState:   isHourly  ? '' : val('dropoff-state').toUpperCase(),
          airport:        isAirport ? val('airport')       : '',
          airline:        isAirport ? val('airline')       : '',
          flightNumber:   isAirport ? val('flight-number') : '',
          terminal:       isAirport ? val('terminal')      : '',
          date:           val('trip-date'),
          time:           val('trip-time'),
          endTime:        isHourly  ? val('trip-end-time') : '',
          instructions:   val('instructions'),
          status:         'pending',
          createdAt:      firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt:      firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(docRef) {
          showSuccess(docRef.id, {
            date:           val('trip-date'),
            time:           val('trip-time'),
            pickupAddress:  val('pickup-address'),
            pickupCity:     val('pickup-city'),
            dropoffAddress: isHourly  ? '' : val('dropoff-address'),
            dropoffCity:    isHourly  ? '' : val('dropoff-city'),
            airport:        isAirport ? val('airport') : '',
            tripType:       currentTripType,
            vehicleSnap:    selectedVehicleSnap
          });
        }).catch(function(err) {
          submitBtn.disabled = false;
          submitBtn.classList.remove('is-loading');
          errorEl.textContent = 'Error saving booking: ' + err.message;
          errorEl.classList.add('visible');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function validate() {
      var errors = [];
      if (!selectedVehicleId)    errors.push('Please select a vehicle.');
      if (!val('pickup-address')) errors.push('Pickup address is required.');
      var dateVal = val('trip-date');
      if (!dateVal) {
        errors.push('Date is required.');
      } else {
        var now   = new Date();
        var today = now.getFullYear() + '-' +
          String(now.getMonth() + 1).padStart(2, '0') + '-' +
          String(now.getDate()).padStart(2, '0');
        if (dateVal < today) errors.push('Please select today or a future date.');
      }
      if (!val('trip-time')) errors.push('Departure time is required.');
      return errors;
    }

    function val(id) {
      var el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function showSuccess(tripId, t) {
      // Swap form for success panel
      document.getElementById('booking-form').classList.add('hidden');
      document.getElementById('header-title').textContent = 'Booking Confirmed';
      document.getElementById('header-back').href = 'index.html';

      // Populate summary
      document.getElementById('sc-when').textContent = formatSuccessDate(t.date) + ' at ' + formatTime(t.time);

      var pickup = t.pickupAddress || '—';
      if (t.pickupCity) pickup += ', ' + t.pickupCity;
      document.getElementById('sc-pickup').textContent = pickup;

      var destRow = document.getElementById('sc-dest-row');
      var isAirport = t.tripType && t.tripType.includes('Airport');
      var isHourly  = t.tripType && t.tripType.includes('Hourly');
      if (isHourly) {
        destRow.classList.add('hidden');
      } else {
        var dest = isAirport ? (t.airport || 'Airport') : (t.dropoffAddress || '');
        if (!isAirport && t.dropoffCity) dest += ', ' + t.dropoffCity;
        document.getElementById('sc-dest').textContent = dest || '—';
      }

      var v = t.vehicleSnap || {};
      document.getElementById('sc-vehicle').textContent =
        ((v.year ? v.year + ' ' : '') + (v.make || '') + ' ' + (v.model || '')).trim() || '—';

      document.getElementById('sc-view-btn').href = 'trip-detail.html?id=' + tripId;

      document.getElementById('sc-cal-btn').addEventListener('click', function() {
        downloadICS(tripId, t);
      });

      document.getElementById('success-panel').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function downloadICS(tripId, t) {
      var date = t.date || '';
      var time = t.time || '09:00';
      var parts = date.split('-');
      var tp    = time.split(':');

      var startH = parseInt(tp[0], 10);
      var startM = parseInt(tp[1], 10);

      // End time: use endTime if hourly, otherwise 1 hour after start
      var endH = startH + 1;
      var endM = startM;
      if (t.tripType && t.tripType.includes('Hourly') && t.endTime) {
        var ep = t.endTime.split(':');
        endH = parseInt(ep[0], 10);
        endM = parseInt(ep[1], 10);
      }
      if (endH >= 24) { endH = 23; endM = 59; }

      var pad = function(n) { return String(n).padStart(2, '0'); };
      var dateStr  = parts.join('');
      var startStr = dateStr + 'T' + pad(startH) + pad(startM) + '00';
      var endStr   = dateStr + 'T' + pad(endH)   + pad(endM)   + '00';

      var isAirport = t.tripType && t.tripType.includes('Airport');
      var isHourly  = t.tripType && t.tripType.includes('Hourly');

      var summary = 'Steward — ' + (t.tripType || 'Ride');

      var location = [t.pickupAddress, t.pickupCity].filter(Boolean).join(', ');

      var descParts = [];
      if (location)          descParts.push('Pickup: ' + location);
      if (isAirport && t.airport) descParts.push('Airport: ' + t.airport);
      if (!isAirport && !isHourly && t.dropoffAddress)
        descParts.push('To: ' + [t.dropoffAddress, t.dropoffCity].filter(Boolean).join(', '));
      var v = t.vehicleSnap || {};
      var vehicleStr = ((v.year ? v.year + ' ' : '') + (v.make || '') + ' ' + (v.model || '')).trim();
      if (vehicleStr) descParts.push('Vehicle: ' + vehicleStr);

      var uid = 'steward-' + tripId + '@steward.app';
      var now = new Date();
      var stamp = now.getUTCFullYear() +
        pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' +
        pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';

      var ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Steward//Steward App//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        'UID:' + uid,
        'DTSTAMP:' + stamp,
        'DTSTART:' + startStr,
        'DTEND:' + endStr,
        'SUMMARY:' + summary,
        'LOCATION:' + location,
        'DESCRIPTION:' + descParts.join('\\n'),
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href     = url;
      a.download = 'steward-ride-' + (date || 'trip') + '.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 10000);
    }

    function formatSuccessDate(d) {
      if (!d) return '—';
      var p  = d.split('-');
      var dt = new Date(+p[0], +p[1]-1, +p[2]);
      var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var MONS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return DAYS[dt.getDay()] + ', ' + MONS[dt.getMonth()] + ' ' + dt.getDate();
    }

    function formatTime(t) {
      if (!t) return '—';
      var p = t.split(':'), h = +p[0], m = p[1];
      return (h % 12 || 12) + ':' + m + (h >= 12 ? ' PM' : ' AM');
    }
